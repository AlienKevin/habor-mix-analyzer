[project]
name = "habor-mix-analyzer"
version = "0.1.0"
description = "Cross-benchmark analysis pipeline for large-scale agent evaluation score matrices."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
]

[project.scripts]
habor-analyze = "habor_mix_analyzer.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
